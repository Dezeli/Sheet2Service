# The public face of a production run: the built screens, and /api handed to Django.
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # the tunnel reports https; Django needs it for secure cookies and CSRF
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;  # generating a service waits on one Claude call
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # every other path is a screen of the app (/<upload>/<role>, the landing page)
    location / {
        try_files $uri /index.html;
    }
}
